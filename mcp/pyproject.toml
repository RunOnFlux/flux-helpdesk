[project]
name = "flux-helpdesk-mcp"
version = "0.1.0"
description = "MCP server for Flux Helpdesk (Frappe Helpdesk): search, read and answer tickets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = ["mcp>=2.3,<3", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
flux-helpdesk-mcp = "flux_helpdesk_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
