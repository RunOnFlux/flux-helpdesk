[project]
name = "flux_helpdesk"
authors = [{ name = "Flux", email = "support@runonflux.io" }]
description = "Flux's add-on for Frappe Helpdesk: Flux theme, support page, AI answers, Discord alerts and a Freshdesk importer"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
dynamic = ["version"]
# requests and beautifulsoup4 already ship with Frappe and Helpdesk.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["mcp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B006", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["flux_helpdesk"]
known-third-party = ["frappe", "helpdesk"]

[tool.ruff.format]
quote-style = "double"
